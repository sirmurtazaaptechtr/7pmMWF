<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
</head>

<body>
    <h1>Task - 2</h1>
    <form action="" method="">
        <table border="1" width="400" cellpadding="8">
            <thead>
                <tr>
                    <th colspan="2">Registration Form</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><label for="fullName">Enter Name</label></td>
                    <td><input type="text" name="FullName" id="fullName"></td>
                </tr>
                <tr>
                    <td><label for="password">Enter Password</label></td>
                    <td><input type="password" name="Password" id="password"></td>
                </tr>
                <tr>
                    <td><label for="address">Enter Address</label></td>
                    <td><textarea name="Address" id="address"></textarea></td>
                </tr>
                <tr>
                    <td><label for="selectGame">Select Game</label></td>
                    <td>
                        <span id="selectGame">
                            <input type="checkbox" name="Hocky" id="hocky">
                            <label for="hocky">Hocky</label>
                            <br>
                            <input type="checkbox" name="Football" id="football">
                            <label for="football">Football</label>
                            <br>
                            <input type="checkbox" name="Badminton" id="badminton">
                            <label for="badminton">Badminton</label>
                            <br>
                            <input type="checkbox" name="Cricket" id="cricket">
                            <label for="cricket">Cricket</label>
                            <br>
                            <input type="checkbox" name="Volleyball" id="volleyball">
                            <label for="volleyball">Volleyball</label>
                        </span>
                    </td>
                </tr>
                <tr>
                    <td><label for="selectGender">Gender</label></td>
                    <td>
                        <span id="selectGender">
                            <input type="radio" name="gender" id="male">
                            <label for="male">Male</label>

                            <input type="radio" name="gender" id="female">
                            <label for="female">Female</label>
                        </span>
                    </td>
                </tr>
                <tr>
                    <td><label for="age">Select ur Age</label></td>
                    <td>
                        <select name="Age" id="age">
                            <option value="0">Select</option>
                            <option value="12">0-12</option>
                            <option value="19">13-19</option>
                            <option value="39">20-39</option>
                            <option value="40">40+</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="photo">Select Photo</label></td>
                    <td><input type="file" name="Photo" id="photo"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">
                        <input type="button" value="ClickMe">
                        <input type="reset" value="Reset">
                        <input type="submit" value="Submit Form">
                    </td>
                </tr>
            </tfoot>
        </table>
    </form>
</body>

</html>
