<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>
    <style>
        * {
            font-family: cursive;
            box-sizing: border-box;
            margin: 0px;padding: 0px;
        }
        .container {
            display: grid;            
            grid-template-columns: repeat(5,100px);            
            grid-auto-rows: 100px;
        }
        .item {
            border: 1px dotted red;
        }
        #i2, #i8 {
            grid-column: 2 / span 2;            
        }
        #i4 {
            grid-column: 1 / span 2;
        }                
        #i5 {
            grid-column: 3 / span 2;
        }                
        #i3, #i9 {
            grid-column: 4 / span 2;            
        }
    </style>
</head>
<body>
    <h1>CSS Grid Layout</h1>
    <div class="container">
        <div class="item" id="i1">item-1</div>
        <div class="item" id="i2">item-2</div>
        <div class="item" id="i3">item-3</div>
        <div class="item" id="i4">item-4</div>
        <div class="item" id="i5">item-5</div>
        <div class="item" id="i6">item-6</div>
        <div class="item" id="i7">item-7</div>
        <div class="item" id="i8">item-8</div>
        <div class="item" id="i9">item-9</div>
    </div>
</body>
</html>
