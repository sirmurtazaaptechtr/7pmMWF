<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS</title>
</head>
<body>
    <h1 style="color: red;text-align: center;">Welcome to CSS</h1>
    <h2 style="color: green;text-align: center;">Inline CSS</h2>
    <p><b style="color: hotpink;">Inline CSS</b> is a method used to apply styling rules directly to a single HTML element by using the <i style="color: hotpink;">style</i> attribute inside the HTML tag. </p>
    <p><b style="color: hotpink;">The end</b></p>
</body>
</html>
