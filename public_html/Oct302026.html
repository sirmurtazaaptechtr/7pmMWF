<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: cursive;
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(5,100px);
            grid-auto-rows: 100px;
            height: 100vh;
            
            /* justify-items: center; */
            /* align-items: center; */
            justify-content: center;
            align-content: center;
            /* gap: 16px; */
        }     

        .box {
            border: 1px dotted red;
        }

        #b1 {
            grid-column: 1 / span 5;
        }

        #b2 {
            grid-column: 1 / span 4;
            grid-row: 2 / span 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="b1">1</div>
        <div class="box" id="b2">2</div>
        <div class="box" id="b3">3</div>
        <div class="box" id="b4">4</div>
        <div class="box" id="b5">5</div>
        <div class="box" id="b6">6</div>
        <div class="box" id="b7">7</div>
        <div class="box" id="b8">8</div>
        <div class="box" id="b9">9</div>
    </div>
</body>

</html>
