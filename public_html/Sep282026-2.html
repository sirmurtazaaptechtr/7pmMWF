<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded CSS / internal CSS</title>
    <style>
        h1 {
            color: red;
            text-align: center;
        }
        h2 {
            color: green;
            text-align: center;
        }
        p b, p i {
            color: hotpink;
        }        
    </style>
</head>
<body>
    <h1>Welcome to CSS</h1>
    <h2>Embedded CSS or Internal CSS</h2>
    <p><b>Embedded CSS (commonly called internal CSS)</b> is a method used to apply styling rules to a single HTML document by placing all CSS rules inside a <i>&lt;style&gt;</i> tag, which is nested within the <i>&lt;head&gt;</i> section of the webpage.</p>
    <p><b>The End</b></p>
    
</body>
</html>
